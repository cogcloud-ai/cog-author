schema: openteams/cog-manifest [0.1]
id: openteams/cog-author
version: 0.1.0
summary: 'Designs and authors bounded context and pure code Cogs from a work brief.

  '
license: Apache-2.0
kind: context
owner: trent@openteams.com
frames: []
context:
  instructions: context/system.md
  input_schema: context/input-schema.json
  output_schema: context/output-schema.json
  output_example: context/output-example.json
requires:
- capability: model-endpoint/openai-compatible
  locality: any
  satisfied_by:
    cog: openteams/cog-qwen
    version: '>=0.1.0'
    source: ../cog-qwen
interfaces:
- name: web-api
  kind: http-json
  task: serve
  endpoint: http://127.0.0.1:8111/ask
  audience: usage
  default: true
- name: cli
  kind: command
  task: ask
  audience: usage
- name: health
  kind: command
  task: check
  audience: lifecycle
- name: composition
  kind: command
  task: composition
  audience: lifecycle
- name: export-draft
  kind: command
  task: export-draft
  audience: lifecycle
- name: composed-cli
  kind: command
  task: ask-composed
  audience: usage
io:
  accepts:
  - task_request
  produces:
  - cog_source_draft
memory: none
prohibits:
- execute_generated_code
- publish_package
- send_external_message
evaluation:
  fixtures:
  - evals/smoke.fixture.yaml
  - evals/insufficient.fixture.yaml
  - evals/adversarial.fixture.yaml
  - evals/boundary.fixture.yaml
  - evals/author.fixture.yaml
  - evals/revise.fixture.yaml
extensions:
  workbench_composition:
    contract: openteams/context-composition [0.1-draft]
    bridge_interface: composition
    accepted_compositions:
    - harness
    - model+harness
    required_features:
    - context/per-turn
    - memory/none
    - json-output
    allowed_localities:
    - local
    - cloud
    tools: none
    checks: packaged-before-and-after
    evidence_scope: composed-system
